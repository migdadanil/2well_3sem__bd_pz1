<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}The Sopranos{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Georgia&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Аудио плеер (скрытый) -->
    <audio id="bg-music" loop>
        <source src="{{ url_for('static', filename='audio/sopranos-theme.mp3') }}" type="audio/mpeg">
    </audio>

    <!-- Кнопка музыки -->
    <button id="music-toggle" onclick="toggleMusic()">🎵 Музыка</button>

    <nav class="navbar">
        <div class="logo">🦆 The Sopranos</div>
        <ul class="nav-menu">
            <li><a href="{{ url_for('index') }}">Главная</a></li>
            <li><a href="{{ url_for('about') }}">О проекте</a></li>
            <li><a href="{{ url_for('contact') }}">Контакты</a></li>
        </ul>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
    <p>Создано с уважением к сериалу</p>
    <p style="margin-top: 10px; font-size: 0.85rem;">
        Данил Мигда & Азалия Медведева &copy; 2026
    </p>
</footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
